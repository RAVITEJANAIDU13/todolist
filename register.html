<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TodoPro Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080b14; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #e8eaf0; }
        .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2.5rem; width: 420px; max-width: 95vw; }
        .card h2 { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #00f2fe, #b300ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem; }
        .card p { font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 0.4rem; }
        input, select { width: 100%; padding: 0.65rem 0.9rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e8eaf0; font-size: 0.875rem; font-family: 'Inter', sans-serif; }
        input:focus, select:focus { outline: none; border-color: #00f2fe; }
        select option { background: #0e1422; }
        .btn { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #00f2fe, #b300ff); color: #fff; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 1rem; font-family: 'Inter', sans-serif; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .error { background: rgba(255,8,68,0.1); border: 1px solid rgba(255,8,68,0.3); padding: 0.75rem; border-radius: 8px; color: #ff0844; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
        .success { background: rgba(0,242,96,0.1); border: 1px solid rgba(0,242,96,0.3); padding: 0.75rem; border-radius: 8px; color: #00f260; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: rgba(255,255,255,0.35); }
        .footer a { color: #00f2fe; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        <p>Join TodoPro Enterprise — select your role and register</p>
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        <form id="registerForm">
            <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="Choose a username" required></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="you@example.com" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6"></div>
            <div class="form-group">
                <label>Role</label>
                <select id="role" required>
                    <option value="EMPLOYEE">Employee</option>
                    <option value="SELF">Personal (Self)</option>
                    <option value="ADMIN">Administrator</option>
                </select>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <div class="footer">Already have an account? <a href="index.html">Sign in here</a></div>
    </div>
    <script src="/js/core/api.js"></script>
    <script src="/js/core/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async e => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const errEl = document.getElementById('errorMsg');
            const okEl = document.getElementById('successMsg');
            errEl.style.display = 'none';
            okEl.style.display = 'none';
            try {
                await Api.post('/users', { username, email, password, role });
                okEl.textContent = 'Account created! Logging you in...';
                okEl.style.display = 'block';
                setTimeout(async () => {
                    await Auth.login(email, password, role);
                }, 1000);
            } catch (err) {
                errEl.textContent = err.message || 'Registration failed';
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
